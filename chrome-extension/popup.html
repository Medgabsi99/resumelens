<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ResumeLens Job Matcher</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --paper: #111827;
      --paper-card: #1f2937;
      --border: rgba(255, 255, 255, 0.08);
      --ink: #f9fafb;
      --ink-muted: #9ca3af;
      --ink-faint: #6b7280;
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.15);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.1);
      --warn: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 380px;
      max-height: 600px;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 16px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
    }

    /* Scrollbar */
    body::-webkit-scrollbar {
      width: 6px;
    }
    body::-webkit-scrollbar-track {
      background: transparent;
    }
    body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #a78bfa, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 12px;
      background: var(--border);
      color: var(--ink-muted);
    }
    .badge.connected {
      background: var(--success-glow);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-muted);
      margin-bottom: 10px;
    }

    .form-group {
      margin-bottom: 10px;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-faint);
      display: block;
      margin-bottom: 4px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--ink);
      font-family: inherit;
      font-size: 12.5px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      height: 70px;
      resize: none;
    }

    button {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Loading states */
    .loader {
      display: none;
      text-align: center;
      padding: 24px;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Results layout */
    #results {
      display: none;
    }

    .score-container {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    /* Custom SVG Score Ring */
    .score-ring {
      position: relative;
      width: 64px;
      height: 64px;
    }
    .score-ring svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }
    .score-ring circle {
      fill: none;
      stroke-width: 5;
    }
    .score-ring .bg {
      stroke: var(--border);
    }
    .score-ring .val {
      stroke: var(--accent);
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s ease-out;
    }
    .score-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 800;
    }

    .fit-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .fit-badge.strong {
      background: var(--success-glow);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .fit-badge.good {
      background: rgba(139, 92, 246, 0.1);
      color: #a78bfa;
      border: 1px solid rgba(139, 92, 246, 0.2);
    }
    .fit-badge.fair {
      background: rgba(245, 158, 11, 0.1);
      color: var(--warn);
      border: 1px solid rgba(245, 158, 11, 0.2);
    }
    .fit-badge.weak {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .summary-text {
      font-size: 12.5px;
      opacity: 0.85;
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .keyword-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .chip {
      font-size: 10px;
      font-weight: 500;
      padding: 2.5px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .chip.matched {
      background: var(--success-glow);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.2);
    }
    .chip.missing {
      background: rgba(239, 68, 68, 0.08);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.15);
    }

    .rec-item {
      font-size: 11.5px;
      margin-bottom: 6px;
      padding-left: 14px;
      position: relative;
      opacity: 0.85;
    }
    .rec-item::before {
      content: "•";
      color: var(--accent);
      position: absolute;
      left: 2px;
      font-weight: bold;
    }

    .error-notice {
      color: var(--danger);
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
      font-weight: 500;
      display: none;
    }

    .success-alert {
      color: var(--success);
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color: #a78bfa;">
        <path d="M2 12h5l3.5 9L15 3l3.5 9H22"/>
      </svg>
      ResumeLens
    </div>
    <span id="connectionBadge" class="badge">Checking connection...</span>
  </header>

  <!-- Setup State (Job Info + Resume Select) -->
  <div id="setup">
    <div class="card">
      <h3>💼 Scraped Job Details</h3>
      <div class="form-group">
        <label>Job Title</label>
        <input type="text" id="jobTitle" placeholder="Scraping title...">
      </div>
      <div class="form-group">
        <label>Company Name</label>
        <input type="text" id="companyName" placeholder="Scraping company...">
      </div>
      <div class="form-group">
        <label>Job Description</label>
        <textarea id="jobDescription" placeholder="Scraping description..."></textarea>
      </div>
    </div>

    <div class="card">
      <h3>📄 Match With Resume</h3>
      <div class="form-group">
        <label>Select Target Resume</label>
        <select id="resumeSelector">
          <option value="">-- Load resumes from library --</option>
        </select>
      </div>
    </div>

    <button id="matchBtn" disabled>Evaluate Match Score</button>
    <div id="setupError" class="error-notice"></div>
  </div>

  <!-- Loading State -->
  <div id="loader" class="loader">
    <div class="spinner"></div>
    <p style="font-weight: 600; color: var(--ink-muted);">Calculating Match Score...</p>
    <p style="font-size: 11px; color: var(--ink-faint); margin-top: 4px;">Analyzing keywords and checking gaps using Gemini</p>
  </div>

  <!-- Results Dashboard -->
  <div id="results">
    <div class="card">
      <div class="score-container">
        <!-- Circular Progress Ring -->
        <div class="score-ring">
          <svg viewBox="0 0 36 36">
            <circle class="bg" cx="18" cy="18" r="15.915"></circle>
            <circle class="val" id="scoreValCircle" cx="18" cy="18" r="15.915" stroke-dasharray="100" stroke-dashoffset="100"></circle>
          </svg>
          <div class="score-text" id="scoreText">0%</div>
        </div>
        <div>
          <span id="fitVerdict" class="fit-badge good">Good Fit</span>
          <p style="font-size: 11px; color: var(--ink-faint); margin-top: 4px;" id="companyRoleText"></p>
        </div>
      </div>

      <p class="summary-text" id="matchSummary"></p>
    </div>

    <div class="card">
      <h3>🔍 Keywords & Skills</h3>
      <div class="keyword-grid" id="keywordGrid">
        <!-- Matched and missing keyword badges -->
      </div>
    </div>

    <div class="card">
      <h3>💡 Recommendations</h3>
      <div id="recommendationsList">
        <!-- List of actionable items -->
      </div>
    </div>

    <div class="card">
      <h3>✉️ Cold Outreach Pitch</h3>
      <div class="form-group">
        <label>Recruiter Name (Optional)</label>
        <input type="text" id="recruiterName" placeholder="e.g. Sarah">
      </div>
      <div class="form-group">
        <label>Recipient Type</label>
        <select id="outreachType">
          <option value="recruiter">Recruiter / Hiring Manager (Professional)</option>
          <option value="peer">Future Peer / Engineer (Collaborative)</option>
        </select>
      </div>
      <button id="outreachBtn" style="background: linear-gradient(135deg, #8b5cf6, #6366f1); margin-top: 8px;">Generate Outreach Pitch ✨</button>
      
      <div id="outreachResultBox" style="display: none; margin-top: 10px; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;">
        <textarea id="outreachText" style="height: 110px; font-size: 11px; line-height: 1.45; border: none; background: transparent; padding: 0; color: var(--ink); width: 100%; resize: vertical;" readonly></textarea>
        <button id="copyOutreachBtn" style="background: var(--success); font-size: 11px; padding: 5px 10px; margin-top: 8px; width: auto; font-family: inherit; display: inline-flex;">Copy Pitch</button>
      </div>
      <div id="outreachLoader" class="loader" style="padding: 10px 0 0 0;">
        <div class="spinner" style="width: 16px; height: 16px; border-width: 2px; margin-bottom: 4px;"></div>
        <p style="font-size: 10.5px; color: var(--ink-muted);">Drafting pitch message...</p>
      </div>
      <div id="outreachError" class="error-notice" style="margin-top: 8px;"></div>
    </div>

    <button id="trackBtn">Add to Job Tracker 🎯</button>
    <button id="backBtn" style="background: transparent; border: 1px solid var(--border); color: var(--ink-muted); margin-top: 8px; font-weight: 600;">← Back to details</button>
    
    <div id="resultError" class="error-notice"></div>
    <div id="successAlert" class="success-alert"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
