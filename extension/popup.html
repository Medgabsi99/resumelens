<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ResumeLens Job Clipper</title>
  <style>
    :root {
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: white;
    }
    .title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .subtitle {
      font-size: 11px;
      color: var(--text-muted);
    }
    .job-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .job-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #fff;
    }
    .job-company {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
    }
    .job-source {
      font-size: 10px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: #c4b5fd;
      padding: 2px 8px;
      border-radius: 10px;
      display: inline-block;
      margin-top: 8px;
      font-weight: 700;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
    }
    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: #334155;
    }
    .status {
      font-size: 11px;
      text-align: center;
      margin-top: 10px;
      min-height: 16px;
    }
    .status.success { color: #4ade80; }
    .status.error { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">RL</div>
    <div>
      <div class="title">ResumeLens Clipper</div>
      <div class="subtitle">1-Click Job Clipper</div>
    </div>
  </div>

  <div class="job-card">
    <div id="jobTitle" class="job-title">Detecting job posting...</div>
    <div id="jobCompany" class="job-company">Open a job page on LinkedIn or Indeed</div>
    <span id="jobSource" class="job-source">ResumeLens</span>
  </div>

  <button id="clipBtn" class="btn btn-primary">
    ⚡ Clip to Application Tracker
  </button>

  <button id="analyzeBtn" class="btn btn-secondary">
    🔬 Clip &amp; Open in ResumeLens
  </button>

  <div id="statusMsg" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
